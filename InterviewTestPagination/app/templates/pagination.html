<div class="pagination">
    <div>
        Items per page
        <select ng-model="pageSize"
                ng-options="option.value as option.label for option in pageSizeOptions"
                ng-change="changePageSize()"></select>
    </div>
    <div>
        <button type="button" ng-click="goTo(1)" ng-disabled="page <= 1">&lt;&lt;</button>
        <button type="button" ng-click="goTo(page - 1)" ng-disabled="page <= 1">&lt;</button>

        Page <input type="number" min="1" max="{{totalPages()}}"
                    ng-model="input.page"
                    ng-model-options="{ debounce: 500, allowInvalid: true }"
                    ng-change="goToInput()"
                    ng-blur="resetInput()" /> of {{totalPages()}}

        <button type="button" ng-click="goTo(page + 1)" ng-disabled="page >= totalPages()">&gt;</button>
        <button type="button" ng-click="goTo(totalPages())" ng-disabled="page >= totalPages()">&gt;&gt;</button>
    </div>
    <div>
        <span>{{totalItems}} items</span>
    </div>
</div>
