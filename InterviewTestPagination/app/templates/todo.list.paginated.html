<!-- table of contents -->
<table>
    <thead>
        <!-- Clicking a header sorts the WHOLE list (server side) by that property: 1st click ascending, then toggles.
             Only one property at a time; the indicator (▲ ascending / ▼ descending) shows on the active header only.
             On first load there is no indicator: the list comes sorted by createdDate descending. -->
        <tr>
            <th ng-click="sortBy('id')">Id <span class="sort-indicator">{{ sortIndicator('id') }}</span></th>
            <th ng-click="sortBy('task')">Task <span class="sort-indicator">{{ sortIndicator('task') }}</span></th>
            <th ng-click="sortBy('createdDate')">Created Date <span class="sort-indicator">{{ sortIndicator('createdDate') }}</span></th>
        </tr>
    </thead>

    <!-- table:body -->
    <!-- while a request is in flight the body is replaced by the loading indicator -->
    <tbody ng-if="loading">
        <tr><td colspan="3">Loading...</td></tr>
    </tbody>
    <tbody ng-if="!loading && error">
        <tr><td colspan="3">{{ error }}</td></tr>
    </tbody>
    <tbody ng-if="!loading && !error">
        <tr ng-repeat="todo in todos track by todo.id">
            <td>{{todo.id}}</td>
            <td>{{todo.task}}</td>
            <td>{{todo.createdDate | date:'MM/dd/yyyy' }}</td>
        </tr>
        <tr ng-if="!todos.length"><td colspan="3">No items</td></tr>
    </tbody>
</table>

<!-- pagination component -->
<pagination page="paging.page"
            page-size="paging.pageSize"
            total-items="paging.totalItems"
            on-change="load(page, pageSize)"></pagination>
